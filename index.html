<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Fit Plan</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14232b;--mute:#5b6b74;--line:#d5dee3;--acc:#3b4ba8;--on:#fff;--ok:#0f7f74;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f181d;--card:#18252c;--ink:#e8eef1;--mute:#9bacb5;--line:#2a3a43;--acc:#8c9bff;--on:#0f181d;--ok:#4fd1c2}}
:root[data-theme="dark"]{--bg:#0f181d;--card:#18252c;--ink:#e8eef1;--mute:#9bacb5;--line:#2a3a43;--acc:#8c9bff;--on:#0f181d;--ok:#4fd1c2}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 12px 96px}
h2{font-size:16px;margin:0 0 6px}h3{font-size:17px;margin:0}small,.note{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
button,a.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
button.on,.chips button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}.chips button{padding:8px 0;justify-content:center;font-size:13px}
.set{width:44px;justify-content:center}.big{width:100%;justify-content:center;background:var(--ok);color:var(--on);border:0;font-weight:600}
input,select{font:inherit;width:110px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
ul{margin:4px 0;padding-left:18px}.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;justify-content:center}
</style></head><body>
<main><div id="v"></div></main>
<nav><button data-t="h">Home</button><button data-t="w">Workout</button><button data-t="f">Food</button><button data-t="p">Progress</button></nav>
<script>
const EX={
A:[["Legs","Goblet squat","Leg press","Smith machine squat"],["Chest","DB bench press","Machine chest press","Push-ups"],["Back","Seated cable row","DB row","Machine row"],["Shoulders","DB shoulder press","Machine shoulder press","Arnold press"],["Hamstrings","Leg curl","Glute bridge","Light Romanian deadlift"],["Triceps","Triceps pushdown","Overhead DB extension","Bench dips"],["Rear shoulders","Rear delt fly","Face pull","Reverse pec deck"],["Core","Plank","Dead bug","Cable crunch"]],
B:[["Hamstrings and glutes","Romanian deadlift","Hip thrust","Back extension"],["Back","Lat pulldown","Assisted pull-up","Machine pulldown"],["Upper chest","Incline DB press","Incline machine press","Incline push-ups"],["Legs","Split squat","Step-ups","Single-leg leg press"],["Side shoulders","Lateral raise","Cable lateral raise","Machine lateral raise"],["Biceps","Biceps curl","Hammer curl","Cable curl"],["Calves","Calf raise","Leg press calf raise","Seated calf raise"],["Abs","Hanging knee raise","Cable crunch","Reverse crunch"]]};
const F=[["Banana before gym",1],["3 eggs",18],["Curd, 1 cup",8],["Dal bowl at lunch",10],["Soya chunks, 50 g dry",26],["Roasted chana, 40 g",8],["Dinner dal or egg curry",15],["Curd at dinner",6],["Extra 2 eggs",12],["Second dal bowl",10]];
const DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],TY=["A","B","E","A","B","I","R"];
const now=new Date(),ti=(now.getDay()+6)%7;
const p=n=>String(n).padStart(2,"0"),ds=d=>d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
const dateOf=i=>ds(new Date(now.getFullYear(),now.getMonth(),now.getDate()+i-ti));
const yt=n=>"https://www.youtube.com/results?search_query="+encodeURIComponent(n+" proper form");
const G={Chest:["Upper chest","Mid chest"],Back:["Lats","Upper back","Lower back"],Shoulders:["Front delts","Side delts","Rear delts"],Arms:["Biceps","Triceps"],Legs:["Quads","Hamstrings","Glutes","Calves"],Core:["Abs"]};
const ALL=Object.values(G).flat();
const MX={A:[[["Quads","Glutes"],["Abs"]],[["Mid chest"],["Front delts","Triceps"]],[["Upper back","Lats"],["Biceps","Rear delts"]],[["Front delts","Side delts"],["Triceps"]],[["Hamstrings"],["Glutes"]],[["Triceps"],[]],[["Rear delts"],["Upper back"]],[["Abs"],["Lower back"]]],
B:[[["Hamstrings","Glutes","Lower back"],["Upper back"]],[["Lats"],["Biceps","Rear delts"]],[["Upper chest"],["Front delts","Triceps"]],[["Quads","Glutes"],["Hamstrings"]],[["Side delts"],[]],[["Biceps"],[]],[["Calves"],[]],[["Abs"],[]]]};
const wk0=()=>dateOf(0),tyx=i=>((S.sw&&S.sw[wk0()])||TY)[i];
function hits(dt,i){const ty=tyx(i),o={};if(ty!="A"&&ty!="B")return o;EX[ty].forEach((r,j)=>{const L=(S.log[dt]||{})[ty+j];if(L&&L.s.some(x=>x))MX[ty][j][0].forEach(m=>o[m]=1)});return o}
function plan(i){const ty=tyx(i);if(ty!="A"&&ty!="B")return[];const s=new Set();MX[ty].forEach(x=>x[0].forEach(m=>s.add(m)));return[...s]}
let S;try{S=JSON.parse(localStorage.getItem("fp")||"null")}catch(e){}
S=S||{};["sel","log","food","done","last","sw"].forEach(k=>S[k]=S[k]||{});S.wt=S.wt||[{d:"2026-10-05",w:95.7}];S.sc=S.sc||[{d:"2026-10-05",f:33,m:36.5}];S.start=S.start||ds(now);
const save=()=>{try{localStorage.setItem("fp",JSON.stringify(S))}catch(e){}};
let di=ti,tab="h",iv;
function rest(s){clearInterval(iv);let r=s;const e=()=>{const t=document.getElementById("tm");if(t)t.textContent=r>0?r+"s":"Go!"};e();iv=setInterval(()=>{r--;e();if(r<=0){clearInterval(iv);try{navigator.vibrate&&navigator.vibrate(300)}catch(x){}}},1000)}
function lg(dt,id){S.log[dt]=S.log[dt]||{};return S.log[dt][id]=S.log[dt][id]||{s:[0,0,0],w:""}}
function W(){const ty=tyx(di),dt=dateOf(di);
let h='<div class="chips">'+DN.map((n,i)=>`<button data-a="day" data-i="${i}" class="${i==di?"on":""}">${n}${S.done[dateOf(i)]?" ✓":""}</button>`).join("")+'</div><div class="row"><small>Move this day to</small><select id="sw">'+DN.map((n,i)=>i==di?"":`<option value="${i}">${n}</option>`).join("")+'</select><button data-a="swp">Swap</button></div>';
if(ty=="R")return h+'<div class="card"><h2>Rest day</h2><p>Recover today. Walk if you feel like it, drink water, sleep well.</p></div>';
h+=WUc(ty,dt);
if(ty=="E"||ty=="I"){const e=ty=="E";h+=`<div class="card"><h2>${e?"Easy cardio, 40-50 min":"Intervals, 25 min + 10 min walk"}</h2><p>${e?"Incline treadmill walk, cycle or elliptical. You should be able to talk.":"Cycle or rower: 1 min hard, 2 min easy. Finish with 10 min easy incline walk. No running for now."}</p><a class="b" href="${yt(e?"incline treadmill walking":"rowing machine intervals")}" target="_blank" rel="noopener">Watch</a></div>`}
else{h+='<div class="card"><b>Full body '+ty+'</b> <small>3 sets of 8-12</small><div class="row"><span>Rest timer <b id="tm"></b></span><span><button data-a="rest" data-s="60">60s</button> <button data-a="rest" data-s="90">90s</button></span></div></div>';
EX[ty].forEach((r,i)=>{const id=ty+i,k=S.sel[id]||0,L=lg(dt,id),n=r[k+1];
h+=`<div class="card"><div class="row"><div><small>Hits ${MX[ty][i][0].join(", ")}${MX[ty][i][1].length?"; also "+MX[ty][i][1].join(", "):""}</small><h3>${n}</h3></div><div><a class="b" href="${yt(n)}" target="_blank" rel="noopener">Watch</a> <button data-a="swap" data-id="${id}" data-n="${r.length-1}">Swap</button></div></div><div class="row"><span>${L.s.map((v,j)=>`<button class="set ${v?"on":""}" data-a="set" data-id="${id}" data-j="${j}">${j+1}</button>`).join(" ")}</span><input inputmode="decimal" data-id="${id}" placeholder="${S.last[id]?"last "+S.last[id]+" kg":"kg"}" value="${L.w}"></div></div>`})}
return h+`<button class="big" data-a="done">${S.done[dt]?"Day done ✓ (tap to undo)":"Mark day done"}</button>`}
function Fd(){const a=S.food[ds(now)]||[],t=F.reduce((s,f,i)=>s+(a[i]?f[1]:0),0);
return `<div class="card"><h2>Protein today: ${t} of 120 g</h2><div class="bar"><i style="width:${Math.min(100,t/1.2)}%"></i></div></div><div class="card">`+F.map((f,i)=>`<div class="row"><span>${f[0]} <small>${f[1]} g</small></span><button class="${a[i]?"on":""}" data-a="food" data-i="${i}">${a[i]?"Eaten":"Add"}</button></div>`).join("")+'</div><p class="note">Target about 2,100-2,200 kcal. Half your plate is sabzi or salad, about 1 tsp oil per person per dish.</p>'}
function P(){return P0()+SC()}
function P0(){const w=S.wt,wk=Math.floor((now-new Date(S.start+"T00:00:00"))/6048e5)+1;let n=0;for(let i=0;i<6;i++)if(S.done[dateOf(i)])n++;
let sp="";if(w.length>1){const v=w.map(x=>x.w),mn=Math.min(...v),r=Math.max(...v)-mn||1;sp='<svg viewBox="0 0 300 80" width="100%"><polyline fill="none" stroke="var(--acc)" stroke-width="3" points="'+v.map((y,i)=>(i*300/(v.length-1)).toFixed(1)+","+(70-(y-mn)/r*60).toFixed(1)).join(" ")+'"/></svg>'}
return `<div class="card"><h2>Week ${wk}: ${n} of 6 workouts done</h2><p>${wk>4?"Time to rotate: tap Swap on each lift for a fresh variation.":"Keep the same lifts for the first 4 weeks and add weight when it feels easy."}</p></div><div class="card"><h2>Weight check-in</h2><div class="row"><input id="wi" inputmode="decimal" placeholder="kg, once a week"><button data-a="wadd">Save</button></div>${sp}${w.slice(-6).reverse().map(x=>`<div class="row"><span>${x.d}</span><b>${x.w} kg</b></div>`).join("")}${w.length>1?`<p>Change since start: ${(w[w.length-1].w-w[0].w).toFixed(1)} kg</p>`:""}</div>`}
const WU={A:["5 min easy cycle or incline walk","Hip circles, then 10 bodyweight squats","Arm circles, 10 each way","Cat-cow, 8 slow reps","First set of each lift: light weight, 10 easy reps"],
B:["5 min easy cycle or incline walk","10 bodyweight good mornings (hinge at the hips)","Leg swings, 10 each leg","Hold the lat bar and pull your shoulder blades down, 8 reps","First set of each lift: light weight, 10 easy reps"],
E:["3 min slow walk, then build to your pace","Leg swings, 10 each leg","Ankle circles, 10 each way"],
I:["5 min easy cycle or rower","3 build-ups: 20 s fast, 40 s easy","Leg swings, 10 each leg"]};
function WUc(ty,dt){const L=lg(dt,"wu");return `<div class="card"><div class="row"><h2>Warm-up, 5-8 min</h2><button data-a="wu" class="${L.s[0]?"on":""}">${L.s[0]?"Done ✓":"Mark done"}</button></div><ul>`+WU[ty].map(x=>`<li>${x}</li>`).join("")+"</ul></div>"}
function SC(){const a=S.sc;
const d=(k,u)=>{const x=a.filter(e=>e[k]!=null);if(x.length<2)return "";const v=x[x.length-1][k]-x[0][k];return (v>0?"+":"")+v.toFixed(1)+u+" since first"};
return `<div class="card"><h2>Body scan and waist</h2><small>Log every 2-4 weeks, same time of day, same conditions.</small><div class="row"><input id="sf" inputmode="decimal" placeholder="Body fat %"><input id="sm" inputmode="decimal" placeholder="Muscle kg"></div><div class="row"><input id="sx" inputmode="decimal" placeholder="Waist cm"><button data-a="sadd">Save</button></div>`+a.slice(-5).reverse().map(e=>`<div class="row"><span>${e.d}</span><small>${e.f!=null?e.f+"% fat ":""}${e.m!=null?e.m+" kg muscle ":""}${e.x!=null?e.x+" cm waist":""}</small></div>`).join("")+`<p><small>Body fat: ${d("f","%")||"first entry"}. Muscle: ${d("m"," kg")||"first entry"}. Waist: ${d("x"," cm")||"add a measurement"}.</small></p></div>`}
function H(){const hd={};ALL.forEach(m=>hd[m]=[]);for(let i=0;i<7;i++)Object.keys(hits(dateOf(i),i)).forEach(m=>hd[m].push(DN[i]));
const n=ALL.filter(m=>hd[m].length).length;
let h=`<div class="card"><h2>This week: ${n} of ${ALL.length} muscles hit</h2><div class="bar"><i style="width:${n/ALL.length*100}%"></i></div><p><small>Weights train ${ALL.length} muscles over 4 days. Cardio (2 days) works your heart, lungs, quads, glutes and calves.</small></p></div>`;
h+=Object.entries(G).map(([g,ms])=>`<div class="card"><h2>${g}: ${ms.filter(m=>hd[m].length).length} of ${ms.length} hit</h2>`+ms.map(m=>`<div class="row"><span>${m}</span><small>${hd[m].length?hd[m].join(", "):"not hit yet"}</small></div>`).join("")+"</div>").join("");
h+='<div class="card"><h2>Week at a glance</h2>'+DN.map((d,i)=>{const dt=dateOf(i),ty=tyx(i),L=ty=="A"||ty=="B",dn=S.done[dt]||Object.keys(hits(dt,i)).length>0,st=ty=="R"?"Rest":dn?"Done":i<ti?"Missed":i==ti?"Today":"Upcoming";return `<div class="row"><span><b>${d}</b> ${L?plan(i).join(", "):ty=="E"?"Easy cardio":"Intervals"}</span><small style="${st=="Missed"?"color:#c0392b;font-weight:600":""}">${st}</small></div>`}).join("")+"</div>";
return h}
function render(){document.getElementById("v").innerHTML=tab=="h"?H():tab=="w"?W():tab=="f"?Fd():P();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab))}
document.addEventListener("click",e=>{const n=e.target.closest("nav button");if(n){tab=n.dataset.t;render();return}
const b=e.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id,dt=dateOf(di);
if(a=="rest"){rest(+b.dataset.s);return}
if(a=="day")di=+b.dataset.i;
if(a=="swap")S.sel[id]=((S.sel[id]||0)+1)%+b.dataset.n;
if(a=="set"){const L=lg(dt,id),j=+b.dataset.j;L.s[j]=L.s[j]?0:1;save();render();if(L.s[j])rest(60);return}
if(a=="swp"){const j=+document.getElementById("sw").value,r=[...(S.sw[wk0()]||TY)];[r[di],r[j]]=[r[j],r[di]];S.sw[wk0()]=r}
if(a=="sadd"){const g=i=>parseFloat(document.getElementById(i).value),f=g("sf"),m=g("sm"),x=g("sx");if(!(f||m||x))return;S.sc.push({d:ds(now),f:f||null,m:m||null,x:x||null})}
if(a=="wu"){const L=lg(dt,"wu");L.s[0]=L.s[0]?0:1}
if(a=="done")S.done[dt]=!S.done[dt];
if(a=="food"){const k=ds(now);S.food[k]=S.food[k]||[];S.food[k][+b.dataset.i]=S.food[k][+b.dataset.i]?0:1}
if(a=="wadd"){const v=parseFloat(document.getElementById("wi").value);if(!v)return;S.wt.push({d:ds(now),w:v})}
save();render()});
document.addEventListener("change",e=>{const i=e.target.closest("input[data-id]");if(!i)return;lg(dateOf(di),i.dataset.id).w=i.value;if(i.value)S.last[i.dataset.id]=i.value;save()});
render();
</script></body></html>
